services:
  - type: web
    name: fix-plant-monitoring-report
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fix-plant-monitoring-db
          property: connectionString
databases:
  - name: fix-plant-monitoring-db
    plan: free
